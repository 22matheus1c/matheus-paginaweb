<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header{
                background-color: #000000;
                color: #FFF200 ;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid #ffffff;
            }
            main {
                background-color: #FFF200;
                color: #000000;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre futebol</p>
        </header>
        <main>
            <img src="imagem-blog.png" alt="">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por:Matheus 🇧🇷​</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar conhecimentos sobre futebol ⚽​.</p>
                <button>🇧🇷 <span>0</span></button>
            </div>
        </main>
     </body>
     <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaClicado);

        function botaoClicado(){
            console.log("fui clicado");
            let texto = botao.querySelector("span")
            texto.textContent++;
        }

     </script>
</html>
